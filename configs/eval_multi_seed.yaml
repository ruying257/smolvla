# mug_v1 多 policy_seed 统计 + Bootstrap 置信区间实验配置（未见场景）。
# 派生自 configs/eval/mug_v1_unseen.yaml：20 个未参与训练的共享 scene ×
# 2 个目标任务（mug_on_blue / mug_on_yellow）× canonical 措辞 = 40 条件/seed，
# 每个条件用 N=3 个 policy seed 重复闭环评测，共 120 条 rollout。
# 快速档使用 3 个 seed；严谨档改为 5 个连续 seed（见 policy_seeds 注释）。
evaluation:
  environment: mug
  output_dir: outputs/eval/mug_v1_s8000_h25_unseen_canonical_multiseed
  fps: 20
  # 每条轨迹最多360步（18秒），与存档 unseen 基线一致。
  max_steps: 360
  # 与存档 mug_v1_s8000_h25_unseen_canonical 一致：每次预测50步、只执行25步后重规划。
  execution_horizon: 25
  # 夹爪迟滞过滤：运输阶段锁存闭爪，只接受持续、接近零的释放意图。
  gripper_filter:
    enabled: true
    close_threshold: 0.8
    open_threshold: 0.05
    close_confirmation_frames: 2
    open_confirmation_frames: 3
  # seed使用真实MugTabletopEnv.reset()在[0,10000)候选池中筛选；排除20个训练seed，
  # 再按4×5空间网格每格选择一个合法、靠近格中心且相互至少相隔4cm的布局。
  scene_seeds:
    - 9201
    - 3132
    - 6943
    - 2277
    - 6343
    - 6043
    - 8846
    - 3174
    - 2076
    - 5724
    - 8320
    - 9165
    - 2721
    - 9162
    - 4175
    - 8848
    - 7149
    - 7586
    - 1323
    - 8780
  task_ids:
    - mug_on_blue
    - mug_on_yellow
  # 杯子环境目前只支持训练时使用的canonical措辞（build_specs会拒绝其他类型）。
  prompt_types:
    - canonical
  # 多seed实验：20260与存档 unseen 40条基线（85%成功率）完全可比；
  # 20261、20262为额外采样种子，仅改变Flow Matching采样噪声。
  # 严谨档可扩为 20260..20264（5个seed，共200条）。
  policy_seeds:
    - 20260
    - 20261
    - 20262
