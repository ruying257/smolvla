# 视觉反事实因果诊断：6个seen场景 × 2种源颜色指令 × 4种视觉版本 = 48个条件。
# 每个scene的red/green original各重复一次，共60个action chunk；只使用policy_seed=20260。
diagnostic:
  scene_seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
  source_colors:
    - red
    - green
  pad_color: blue
  prompt_type: canonical
  visual_variants:
    - original
    - swap_positions
    - neutralize_red
    - neutralize_green
  # 中性化保留积木几何和阴影，只移除红绿颜色身份。
  neutral_rgba: [0.5, 0.5, 0.5, 1.0]
  # 唯一Flow Matching噪声种子，不研究policy seed波动。
  policy_seed: 20260
  analysis_horizons: [10, 50]
