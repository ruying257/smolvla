# 红绿语言条件传播诊断：6个训练已见场景 × 4类任务 × 3种措辞 = 72个条件。
# 每个条件使用同一噪声执行两次，共生成144个action chunk；policy_seed只保留20260。
diagnostic:
  # seed 0至5在四类任务训练示范中均出现，每组红绿对照内部严格固定图像和机器人状态。
  scene_seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
  prompt_types:
    - canonical
    - synonym
    - unseen
  # 仅用于生成并复现唯一的Flow Matching标准高斯噪声，不比较不同policy seed。
  policy_seed: 20260
