# 正式配置：10个未见场景 × 4类任务 × 3种措辞 × 1个固定模型随机种子 = 120条。
# scene_seed控制积木初始布局；policy_seed固定为20260，仅用于复现Flow Matching采样。
evaluation:
  output_dir: outputs/eval/formal_020000
  fps: 20
  # 专家轨迹最大351步，400步即20秒仿真时间，并提供约14%的完成余量。
  max_steps: 400
  # 训练seed范围为0-9和100-139；正式测试使用完全未见的10000-10009。
  scene_seeds:
    - 10000
    - 10001
    - 10002
    - 10003
    - 10004
    - 10005
    - 10006
    - 10007
    - 10008
    - 10009
  task_ids:
    - red_on_blue
    - red_on_yellow
    - green_on_blue
    - green_on_yellow
  # canonical和synonym均在训练中出现；unseen用于语言泛化测试。
  prompt_types:
    - canonical
    - synonym
    - unseen
  policy_seeds:
    - 20260
