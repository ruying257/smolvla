# 基础回归配置：1个未见场景 × 4类任务 × 3种措辞 × 1个模型随机种子 = 12条。
# scene_seed控制积木初始布局；policy_seed固定为20260，仅用于复现Flow Matching采样。
evaluation:
  output_dir: outputs/eval/basic
  fps: 20
  # 专家轨迹最大351步，400步提供约14%的完成余量。
  max_steps: 400
  # 训练使用0-9和100-139；10000是未见场景。
  scene_seeds:
    - 10000
  task_ids:
    - red_on_blue
    - red_on_yellow
    - green_on_blue
    - green_on_yellow
  prompt_types:
    - canonical
    - synonym
    - unseen
  policy_seeds:
    - 20260
